<div id="aviso-modal"
     class="popup-modal-overlay hidden"
     role="alertdialog"
     aria-modal="true"
     aria-labelledby="aviso-modal-title"
     aria-describedby="aviso-modal-message">
    <div class="popup-modal-content">
        <h2 id="aviso-modal-title"></h2>
        <p id="aviso-modal-message"></p>
        <p id="aviso-modal-codigo" class="hidden">
            Código do erro (informe ao abrir um chamado):
            <code id="aviso-modal-codigo-valor"></code>
            <button id="aviso-modal-copiar" type="button" class="popup-btn-cancel">Copiar</button>
        </p>
        <div class="popup-modal-buttons">
            <button id="aviso-modal-fechar" type="button" class="popup-btn-confirm">Fechar</button>
        </div>
    </div>
</div>
