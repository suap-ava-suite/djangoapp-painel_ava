name: Pipeline - Painel AVA

on:

  release:
    types: [published]
  workflow_dispatch:

env:
  MAIN_IMAGE: ctezlifrn/avapainel

jobs:
  publish-docker:
    runs-on: ubuntu-latest
    if: |
      startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    permissions:
      id-token: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.DOCKERHUB_HOST }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: production
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.MAIN_IMAGE }}:${{ github.ref_name }}

  deploy-to-test:
    runs-on: [self-hosted, runner-dead]
    needs: publish-docker
    # Filtra estritamente para rodar apenas se a tag terminar com '-test'
    if: |
      always() && needs.publish-docker.result == 'success' &&
      startsWith(github.ref, 'refs/tags/') && endsWith(github.ref_name, '-test')
    environment:
      name: test

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.K8S_HOST }} >> ~/.ssh/known_hosts

      - name: Enviar Chart do Helm
        run: |
          ssh root@${{ secrets.K8S_HOST }} "rm -rf /tmp/painel-chart"
          scp -r ./helm root@${{ secrets.K8S_HOST }}:/tmp/painel-chart

      - name: Executar Upgrade no Helm
        run: |
          ssh root@${{ secrets.K8S_HOST }} "
            helm upgrade --install painel /tmp/painel-chart \
              --namespace ava \
              --set image.repository=${{ env.MAIN_IMAGE }} \
              --set image.tag=${{ github.ref_name }}
          "

  deploy-to-prod:
    runs-on: [self-hosted, runner-dead]
    needs: publish-docker
    # Filtra estritamente para rodar se for uma tag que NÃO possui o sufixo '-test'
    if: |
      always() && needs.publish-docker.result == 'success' &&
      startsWith(github.ref, 'refs/tags/') && !endsWith(github.ref_name, '-test')
    environment:
      name: production
    strategy:
      fail-fast: false # Se falhar em um servidor, continua no outro
      matrix:
        host: [ "${{ vars.PROD_HOST_1 }}", "${{ vars.PROD_HOST_2 }}", "${{ vars.PROD_HOST_3 }}" ]

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ matrix.host }} >> ~/.ssh/known_hosts

      - name: Executar Upgrade via Docker Compose em ${{ matrix.host }}
        run: |
          rc=0
          ssh root@${{ matrix.host }} "/var/dockers/deploy.sh ${{ github.ref_name }}" || rc=$?
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ]; then
            exit "$rc"
          fi

  sentry-release:
    runs-on: [self-hosted, runner-dead]
    needs: [deploy-to-test, deploy-to-prod]
    # Só registra se algum deploy rodou e nenhum falhou ou foi cancelado
    if: |
      always() && startsWith(github.ref, 'refs/tags/') &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') &&
      (needs.deploy-to-test.result == 'success' || needs.deploy-to-prod.result == 'success')

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Registrar Release e Deploys no Sentry
        env:
          SENTRY_URL: ${{ vars.SENTRY_URL }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          PROD_HOSTS: ${{ vars.PROD_HOST_1 }} ${{ vars.PROD_HOST_2 }} ${{ vars.PROD_HOST_3 }}
        run: |
          if ! command -v sentry-cli >/dev/null 2>&1; then
            export PATH="$RUNNER_TEMP:$PATH"
            curl -sL https://sentry.io/get-cli/ | INSTALL_DIR="$RUNNER_TEMP" sh
          fi
          sentry-cli releases new "${{ github.ref_name }}"
          sentry-cli releases set-commits "${{ github.ref_name }}" --local --ignore-missing
          sentry-cli releases finalize "${{ github.ref_name }}"
          if [ "${{ endsWith(github.ref_name, '-test') }}" = "true" ]; then
            sentry-cli deploys new --release "${{ github.ref_name }}" -e test
          else
            for host in $PROD_HOSTS; do
              sentry-cli deploys new --release "${{ github.ref_name }}" -e production -n "$host"
            done
          fi
